name: Build and deploy examples

on:
  push:
    branches: [main, gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site from gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Check out Python examples from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependency
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Generate example data
        run: python site/scripts/build_examples.py --source source --output site/data
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
